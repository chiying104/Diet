<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8fb">
<title>我的猛健樂日記</title>
<style>
:root{
  --bg:#fff8fb;
  --paper:#ffffff;
  --pink:#ef9db7;
  --pink2:#f7c7d5;
  --pink3:#fdebf1;
  --ink:#382f34;
  --muted:#9b8d95;
  --line:#f1dfe6;
  --shadow:0 12px 32px rgba(184,103,132,.12);
  --radius:26px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:820px;margin:auto;padding:18px 14px 120px}
.page{display:none}
.page.active{display:block}
.header{display:flex;justify-content:space-between;align-items:center;margin:8px 4px 18px}
.header h1{margin:0;font-size:30px;letter-spacing:-.5px}
.header small{color:var(--muted);font-size:15px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:22px;background:linear-gradient(145deg,#f3a7bd,#e889a8);color:white}
.heroTop{display:flex;justify-content:space-between;gap:14px}
.heroLabel{font-size:13px;opacity:.92}
.heroNum{font-size:44px;font-weight:900;margin:8px 0 2px}
.heroMsg{font-size:14px;font-weight:700}
.countdown{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);padding:12px 14px;border-radius:18px;text-align:center;min-width:90px}
.countdown b{font-size:20px;display:block}
.progress{height:10px;border-radius:99px;background:rgba(255,255,255,.27);margin-top:22px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:#fff;border-radius:99px}
.progressMeta{display:flex;justify-content:space-between;font-size:12px;margin-top:7px}
.section{padding:18px;margin-top:14px}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sectionTitle b{font-size:18px}
.sectionTitle span{font-size:12px;color:var(--muted)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{border:0;border-radius:18px;padding:14px 16px;font-weight:800}
.btn.primary{background:var(--pink);color:#fff}
.btn.soft{background:#fff;border:1.5px solid var(--pink2);color:#6a4f5a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{padding:16px}
.stat span{display:block;color:var(--muted);font-size:12px}
.stat b{display:block;font-size:24px;margin-top:8px;color:#7a5865}
.feedItem{padding:14px 0;border-top:1px solid var(--line)}
.feedItem:first-child{border-top:0}
.feedHead{display:flex;justify-content:space-between;gap:10px;font-weight:900}
.feedHead span{font-size:12px;color:var(--muted)}
.feedBody{display:grid;gap:6px;font-size:14px;line-height:1.55;margin-top:10px}
.feedBody b{color:#6b5360}
.empty{padding:26px;text-align:center;color:var(--muted)}
canvas{width:100%;display:block}
.segmented{display:grid;grid-template-columns:repeat(4,1fr);background:#fdebf1;border-radius:18px;padding:5px;margin-bottom:14px}
.segmented button{border:0;background:transparent;padding:11px 6px;border-radius:14px;color:#9b7887;font-weight:800}
.segmented button.active{background:#fff;color:#6e5060;box-shadow:0 4px 12px rgba(162,106,128,.08)}
.summary{padding:20px;display:grid;grid-template-columns:140px 1fr;gap:18px;align-items:center}
.ring{width:130px;height:130px;border:20px solid #f7e5ec;border-radius:50%;display:grid;place-items:center;text-align:center}
.ring b{font-size:25px;color:#d87799}
.ring span{font-size:11px;color:var(--muted)}
.summaryList{display:grid;gap:0}
.summaryList div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.summaryList span{color:var(--muted)}
.table{overflow:hidden;margin-top:14px}
.month{padding:10px 18px;background:#fff0f5;color:#876d78;font-weight:800}
.row{display:grid;grid-template-columns:1.1fr .8fr .8fr .8fr .8fr;gap:8px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);font-size:13px}
.row b{font-size:16px}
.red{color:#ef5e7d}.green{color:#58a06c}.blue{color:#4e95c7}
.calendar{padding:18px}
.calTop{display:flex;justify-content:space-between;align-items:center}
.calTop button{border:0;background:#fff0f5;border-radius:13px;width:42px;height:42px;font-size:24px;color:#7e5f6e}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.week{color:var(--muted);margin:16px 0 8px}
.day{min-height:58px;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:700}
.day.shot{background:var(--pink);color:white}
.day small{font-size:10px;margin-top:3px}
.shotList{display:grid;gap:10px}
.shotChip{background:#fff1f6;border-radius:16px;padding:13px}
.shotChip b{color:#d76e91}
.ledgerHero{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ledgerHero .box{padding:20px;background:linear-gradient(145deg,#f3a7bd,#e889a8);color:#fff;border-radius:24px;box-shadow:var(--shadow)}
.ledgerHero span{font-size:12px;opacity:.9}
.ledgerHero b{display:block;font-size:32px;margin-top:10px}
label{display:block;font-size:13px;font-weight:800;color:#6c5862;margin:12px 0}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-top:7px;background:#fff;color:var(--ink);outline:none}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(239,157,183,.16)}
.bottom{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(94%,780px);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:28px;padding:10px 7px calc(10px + env(safe-area-inset-bottom));box-shadow:0 14px 40px rgba(161,93,120,.18);z-index:20}
.bottom button{border:0;background:transparent;color:#9a8b92;font-weight:800;padding:7px 2px}
.bottom button.active{color:#df7999}
.bottom span{display:block;font-size:23px;margin-bottom:3px}
dialog{border:0;border-radius:24px;width:min(92vw,560px);max-height:82vh;padding:0;box-shadow:0 25px 70px rgba(95,45,64,.25)}
dialog::backdrop{background:rgba(45,31,38,.25);backdrop-filter:blur(2px)}
dialog form{padding:20px}
.modalHead{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:900}
.modalHead button{border:0;background:#fff0f5;width:36px;height:36px;border-radius:99px;font-size:22px;color:#7d5969}
.toast{position:fixed;left:50%;bottom:112px;transform:translate(-50%,15px);opacity:0;background:#5a404c;color:white;padding:10px 14px;border-radius:999px;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){
  .app{padding:14px 10px 118px}
  .header h1{font-size:28px}
  .heroNum{font-size:38px}
  .stats{gap:7px}.stat{padding:14px 10px}.stat b{font-size:20px}
  .summary{grid-template-columns:120px 1fr;gap:12px}.ring{width:112px;height:112px;border-width:17px}
  .row{padding:13px 12px;font-size:12px}
}
</style>
</head>
<body>
<div class="app">

<section id="overview" class="page active">
  <div class="header">
    <div><h1>🌷 我的猛健樂日記</h1><small id="journeyDays">Day —</small></div>
  </div>

  <div class="card hero">
    <div class="heroTop">
      <div>
        <div class="heroLabel" id="heroDirection">今天</div>
        <div class="heroNum" id="heroDelta">—</div>
        <div class="heroMsg" id="heroMsg">每天都好好記錄自己 ♡</div>
      </div>
      <div class="countdown">💉<b id="countdown">—</b><small>注射倒數</small></div>
    </div>
    <div class="progress"><i id="goalProgress"></i></div>
    <div class="progressMeta"><span id="startLbl">起始 —</span><span id="goalGap">距目標 —</span><span id="goalLbl">目標 —</span></div>
  </div>

  <div class="card section">
    <div class="sectionTitle"><div><b>體重曲線</b><span>最近 30 筆</span></div></div>
    <canvas id="overviewChart" height="210"></canvas>
  </div>

  <div class="quick">
    <button class="btn soft" data-open="diaryModal">✍🏻 寫日記</button>
    <button class="btn primary" data-open="weightModal">＋ 紀錄體重</button>
  </div>

  <div class="stats">
    <div class="card stat"><span>已持續</span><b id="statDays">0 天</b></div>
    <div class="card stat"><span>BMI</span><b id="statBMI">—</b></div>
    <div class="card stat"><span>瘦 1kg 花費</span><b id="costPerKg">—</b></div>
  </div>

  <div class="card section">
    <div class="sectionTitle"><div><b>每日總覽</b><span id="diaryTotal">0 筆</span></div></div>
    <div id="feed"></div>
  </div>
</section>

<section id="weight" class="page">
  <div class="header"><h1>體重 <small id="weightDay"></small></h1></div>

  <div class="segmented">
    <button data-range="30">1 個月</button>
    <button class="active" data-range="90">3 個月</button>
    <button data-range="180">6 個月</button>
    <button data-range="all">全部</button>
  </div>

  <div class="card section"><canvas id="weightChart" height="285"></canvas></div>

  <div class="card summary">
    <div class="ring"><div><b id="goalInside">—</b><span>目標體重</span></div></div>
    <div class="summaryList">
      <div><span>總計</span><b id="totalDelta">—</b></div>
      <div><span>距離目標</span><b id="distanceGoal">—</b></div>
      <div><span>當前</span><b id="currentWeight">—</b></div>
      <div><span>起始</span><b id="initialWeight">—</b></div>
    </div>
  </div>

  <div class="quick">
    <button class="btn soft" data-open="diaryModal">☺ 寫日記</button>
    <button class="btn primary" data-open="weightModal">＋ 紀錄體重</button>
  </div>

  <div class="card table"><div id="weightRows"></div></div>
</section>

<section id="shots" class="page">
  <div class="header"><h1>注射 <small id="shotCount">0 次</small></h1></div>
  <div class="card calendar">
    <div class="calTop"><b id="calMonth"></b><div><button id="prevMonth">‹</button><button id="nextMonth">›</button></div></div>
    <div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div id="calGrid" class="grid"></div>
  </div>

  <div class="quick">
    <button class="btn soft" id="doseInfo">♡ 劑量紀錄</button>
    <button class="btn primary" data-open="shotModal">💉 紀錄注射</button>
  </div>

  <div class="card section">
    <div class="sectionTitle"><div><b>最近注射</b><span>最近 3 次</span></div><span id="inlineCountdown">—</span></div>
    <div id="recentShots" class="shotList"></div>
  </div>

  <div class="card table"><div id="shotRows"></div></div>
</section>

<section id="ledger" class="page">
  <div class="header"><h1>帳本</h1></div>
  <div class="ledgerHero">
    <div class="box"><span>累計投資</span><b id="totalSpend">$0</b></div>
    <div class="box"><span>購買數量</span><b id="purchaseCount">0</b></div>
  </div>
  <button class="btn primary" style="width:100%;margin-top:14px" data-open="purchaseModal">＋ 紀錄購買</button>

  <div class="stats">
    <div class="card stat"><span>本月</span><b id="monthSpend">$0</b></div>
    <div class="card stat"><span>平均購買</span><b id="avgSpend">$0</b></div>
    <div class="card stat"><span>瘦 1kg 花費</span><b id="costPerKg2">—</b></div>
  </div>

  <div class="card table"><div id="purchaseRows"></div></div>
</section>

<section id="profile" class="page">
  <div class="header"><h1>我的</h1></div>
  <div class="card section">
    <div class="sectionTitle"><b>旅程設定</b></div>
    <label>開始日期<input id="startDate" type="date"></label>
    <label>起始體重（kg）<input id="startWeight" type="number" step="0.1"></label>
    <label>目標體重（kg）<input id="goalWeight" type="number" step="0.1"></label>
    <label>身高（cm）<input id="heightCm" type="number" step="0.1"></label>
    <button id="saveSettings" class="btn primary" style="width:100%">儲存設定</button>
  </div>
  <div class="card section">
    <div class="sectionTitle"><b>資料備份</b></div>
    <div class="quick">
      <button id="exportJson" class="btn soft">匯出 JSON</button>
      <button id="exportCsv" class="btn soft">匯出 CSV</button>
    </div>
    <label style="margin-top:12px">匯入 JSON<input id="importJson" type="file" accept="application/json"></label>
    <div style="font-size:12px;color:var(--muted);line-height:1.6">資料只存在你的瀏覽器，不會自動公開到 GitHub。</div>
  </div>
</section>

</div>

<nav class="bottom">
  <button class="active" data-page="overview"><span>⌂</span>總覽</button>
  <button data-page="weight"><span>♡</span>體重</button>
  <button data-page="shots"><span>💉</span>注射</button>
  <button data-page="ledger"><span>＄</span>帳本</button>
  <button data-page="profile"><span>♙</span>我的</button>
</nav>

<dialog id="weightModal"><form method="dialog" id="weightForm">
  <div class="modalHead"><span>紀錄體重</span><button value="cancel">×</button></div>
  <label>日期<input id="wDate" type="date" required></label>
  <label>體重（kg）<input id="wWeight" type="number" step="0.1" required></label>
  <label>脂肪（kg，可選）<input id="wFat" type="number" step="0.1"></label>
  <label>肌肉（kg，可選）<input id="wMuscle" type="number" step="0.1"></label>
  <label>體脂％（可選）<input id="wBodyFat" type="number" step="0.1"></label>
  <button class="btn primary" style="width:100%" value="default">儲存</button>
</form></dialog>

<dialog id="shotModal"><form method="dialog" id="shotForm">
  <div class="modalHead"><span>紀錄注射</span><button value="cancel">×</button></div>
  <label>日期<input id="sDate" type="date" required></label>
  <label>時間<input id="sTime" type="time"></label>
  <label>劑量（mg）<select id="sDose"><option>2.5</option><option>5</option><option>7.5</option><option>10</option><option>12.5</option><option>15</option></select></label>
  <label>部位<select id="sSite"><option>右腹</option><option>左腹</option><option>右大腿</option><option>左大腿</option><option>右上臂</option><option>左上臂</option></select></label>
  <label>備註<textarea id="sNote" rows="2"></textarea></label>
  <button class="btn primary" style="width:100%" value="default">儲存</button>
</form></dialog>

<dialog id="diaryModal"><form method="dialog" id="diaryForm">
  <div class="modalHead"><span>今日總覽／日記</span><button value="cancel">×</button></div>
  <label>日期<input id="dDate" type="date" required></label>
  <label>早餐<textarea id="dBreakfast" rows="2"></textarea></label>
  <label>午餐<textarea id="dLunch" rows="2"></textarea></label>
  <label>晚餐<textarea id="dDinner" rows="2"></textarea></label>
  <label>點心／飲料<textarea id="dSnack" rows="2"></textarea></label>
  <label>營養品／藥物<textarea id="dSupplements" rows="2"></textarea></label>
  <label>運動<input id="dExercise" type="text"></label>
  <label>睡眠（hr）<input id="dSleep" type="number" step="0.5"></label>
  <label>心情<select id="dMood"><option>😄 很好</option><option>🙂 不錯</option><option>😐 普通</option><option>😮‍💨 有點累</option><option>😣 不舒服</option></select></label>
  <label>身體感受／副作用<textarea id="dEffects" rows="2"></textarea></label>
  <label>其他備註<textarea id="dNotes" rows="2"></textarea></label>
  <button class="btn primary" style="width:100%" value="default">儲存</button>
</form></dialog>

<dialog id="purchaseModal"><form method="dialog" id="purchaseForm">
  <div class="modalHead"><span>紀錄購買</span><button value="cancel">×</button></div>
  <label>日期<input id="pDate" type="date" required></label>
  <label>劑量（mg）<input id="pDose" type="number" step="0.1"></label>
  <label>價格（NT$）<input id="pPrice" type="number" required></label>
  <label>地點<input id="pPlace" type="text" placeholder="例如：診所"></label>
  <button class="btn primary" style="width:100%" value="default">儲存</button>
</form></dialog>

<div id="toast" class="toast"></div>

<script>
const K={w:'diet.pink.weights',s:'diet.pink.shots',d:'diet.pink.diaries',p:'diet.pink.purchases',cfg:'diet.pink.settings'};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const today=()=>new Date().toLocaleDateString('en-CA');
const parse=s=>new Date(s+'T12:00:00');
const get=k=>{try{return JSON.parse(localStorage.getItem(K[k])||'[]')}catch{return[]}};
const set=(k,v)=>localStorage.setItem(K[k],JSON.stringify(v));
const cfg=()=>{try{return JSON.parse(localStorage.getItem(K.cfg)||'{}')}catch{return{}}};
const setcfg=v=>localStorage.setItem(K.cfg,JSON.stringify(v));
const num=id=>$(id).value===''?null:+$(id).value;
const money=n=>'$'+Math.round(n||0).toLocaleString('zh-TW');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const sort=k=>[...get(k)].sort((a,b)=>a.date.localeCompare(b.date));
const diff=(a,b)=>Math.floor((b-a)/86400000);

function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}
function latestW(){return sort('w').at(-1)}
function dayNo(){const c=cfg();return c.startDate?Math.max(1,diff(parse(c.startDate),parse(today()))+1):0}
function countdown(){
  const a=sort('s'); if(!a.length)return null;
  const d=parse(a.at(-1).date); d.setDate(d.getDate()+7);
  return Math.max(0,diff(parse(today()),d));
}
function nav(id){
  $$('.page').forEach(x=>x.classList.toggle('active',x.id===id));
  $$('.bottom button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));
  renderAll(); window.scrollTo({top:0,behavior:'smooth'});
}
$$('.bottom button').forEach(b=>b.onclick=()=>nav(b.dataset.page));
$$('[data-open]').forEach(b=>b.onclick=()=>openModal(b.dataset.open));
function openModal(id){
  if(id==='weightModal'){$('#wDate').value=today();$('#wWeight').value=latestW()?.weight??''}
  if(id==='shotModal'){$('#sDate').value=today();$('#sTime').value=new Date().toTimeString().slice(0,5)}
  if(id==='diaryModal'){$('#dDate').value=today()}
  if(id==='purchaseModal'){$('#pDate').value=today()}
  $('#'+id).showModal();
}

$('#weightForm').addEventListener('submit',e=>{
  e.preventDefault();
  const o={date:$('#wDate').value,weight:+$('#wWeight').value,fat:num('#wFat'),muscle:num('#wMuscle'),bodyFat:num('#wBodyFat')};
  let a=get('w'),i=a.findIndex(x=>x.date===o.date); i>=0?a[i]=o:a.push(o); set('w',a); $('#weightModal').close(); renderAll(); toast('體重已儲存 ♡');
});
$('#shotForm').addEventListener('submit',e=>{
  e.preventDefault();
  const o={id:Date.now(),date:$('#sDate').value,time:$('#sTime').value,dose:+$('#sDose').value,site:$('#sSite').value,note:$('#sNote').value};
  let a=get('s'); a.push(o); set('s',a); $('#shotModal').close(); renderAll(); toast('注射紀錄已儲存');
});
$('#diaryForm').addEventListener('submit',e=>{
  e.preventDefault();
  const o={date:$('#dDate').value,breakfast:$('#dBreakfast').value,lunch:$('#dLunch').value,dinner:$('#dDinner').value,snack:$('#dSnack').value,supplements:$('#dSupplements').value,exercise:$('#dExercise').value,sleep:num('#dSleep'),mood:$('#dMood').value,effects:$('#dEffects').value,notes:$('#dNotes').value};
  let a=get('d'),i=a.findIndex(x=>x.date===o.date); i>=0?a[i]=o:a.push(o); set('d',a); $('#diaryModal').close(); renderAll(); toast('日記已儲存 ♡');
});
$('#purchaseForm').addEventListener('submit',e=>{
  e.preventDefault();
  const o={id:Date.now(),date:$('#pDate').value,dose:num('#pDose'),price:+$('#pPrice').value,place:$('#pPlace').value};
  let a=get('p'); a.push(o); set('p',a); $('#purchaseModal').close(); renderAll(); toast('購買紀錄已儲存');
});

function draw(sel,arr){
  const c=$(sel),ctx=c.getContext('2d'),dpr=devicePixelRatio||1,w=c.clientWidth||700,h=sel==='#weightChart'?285:210;
  c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
  if(!arr.length){ctx.fillStyle='#a8959e';ctx.font='14px sans-serif';ctx.fillText('尚無體重資料',18,36);return}
  const vals=arr.map(x=>x.weight),mn=Math.min(...vals),mx=Math.max(...vals),pad=34,rg=Math.max(1,mx-mn);
  const X=i=>arr.length===1?w/2:pad+(w-pad*2)*i/(arr.length-1),Y=v=>pad+(h-pad*2)*(1-(v-(mn-.5))/(rg+1));
  ctx.strokeStyle='#f1dfe6';ctx.lineWidth=1;for(let i=0;i<3;i++){let y=pad+(h-pad*2)*i/2;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke()}
  ctx.strokeStyle='#ef9db7';ctx.lineWidth=3;ctx.beginPath();arr.forEach((e,i)=>i?ctx.lineTo(X(i),Y(e.weight)):ctx.moveTo(X(i),Y(e.weight)));ctx.stroke();
  ctx.fillStyle='#ef9db7';arr.forEach((e,i)=>{ctx.beginPath();ctx.arc(X(i),Y(e.weight),4,0,Math.PI*2);ctx.fill()});
  ctx.fillStyle='#9b8d95';ctx.font='11px sans-serif';ctx.fillText(mx.toFixed(1)+'kg',2,pad);ctx.fillText(mn.toFixed(1)+'kg',2,h-pad);
}
let range='90';
$$('.segmented button').forEach(b=>b.onclick=()=>{$$('.segmented button').forEach(x=>x.classList.remove('active'));b.classList.add('active');range=b.dataset.range;renderWeight()});
function rangeData(a){if(range==='all')return a;const cut=new Date();cut.setDate(cut.getDate()-+range);return a.filter(x=>parse(x.date)>=cut)}

function renderOverview(){
  const c=cfg(),ws=sort('w'),cur=ws.at(-1)?.weight,base=c.startWeight??ws[0]?.weight,goal=c.goalWeight,d=dayNo();
  $('#journeyDays').textContent=d?`Day ${d}`:'Day —';$('#statDays').textContent=d?`${d} 天`:'0 天';
  const delta=(base!=null&&cur!=null)?cur-base:null;
  $('#heroDirection').textContent=delta==null?'今天':delta>0?'↗ 比起始增加':delta<0?'↘ 比起始減少':'與起始相同';
  $('#heroDelta').textContent=delta==null?'—':`${delta>0?'+':''}${delta.toFixed(1)} kg`;
  $('#heroMsg').textContent=delta>0?'沒關係，明天又是新的一天 ♡':delta<0?'很棒，繼續穩穩記錄 ♡':'每天都好好記錄自己 ♡';
  const cd=countdown();$('#countdown').textContent=cd==null?'—':`${cd} 天`;$('#inlineCountdown').textContent=cd==null?'注射倒數 —':`注射倒數 ${cd} 天`;
  $('#startLbl').textContent=base!=null?`起始 ${base}kg`:'起始 —';$('#goalLbl').textContent=goal!=null?`目標 ${goal}kg`:'目標 —';
  $('#goalGap').textContent=(cur!=null&&goal!=null)?`距目標 ${Math.abs(cur-goal).toFixed(1)}kg`:'距目標 —';
  if(base!=null&&goal!=null&&cur!=null&&base!==goal){$('#goalProgress').style.width=Math.max(0,Math.min(100,(base-cur)/(base-goal)*100))+'%'} else $('#goalProgress').style.width='0%';
  $('#statBMI').textContent=(cur&&c.heightCm)?(cur/((c.heightCm/100)**2)).toFixed(1):'—';
  const spend=get('p').reduce((a,b)=>a+(+b.price||0),0),lost=(base!=null&&cur!=null)?base-cur:0,cpk=lost>0?spend/lost:null;
  $('#costPerKg').textContent=cpk?money(cpk):'—';$('#costPerKg2').textContent=cpk?money(cpk):'—';
  draw('#overviewChart',ws.slice(-30)); renderFeed();
}
function renderFeed(){
  const ds=sort('d').reverse(),ws=get('w'),ss=get('s');$('#diaryTotal').textContent=`${ds.length} 筆`;
  $('#feed').innerHTML=ds.length?ds.map(d=>{
    const w=ws.find(x=>x.date===d.date),s=ss.filter(x=>x.date===d.date).at(-1);
    return `<div class="feedItem">
      <div class="feedHead"><div>💗 ${esc(d.date)}${w?` ・ ${w.weight}kg`:''}</div><span>${s?`💉 ${s.dose}mg ${esc(s.site)}`:''}</span></div>
      <div class="feedBody">
      ${d.breakfast?`<div><b>早餐：</b>${esc(d.breakfast)}</div>`:''}
      ${d.lunch?`<div><b>午餐：</b>${esc(d.lunch)}</div>`:''}
      ${d.dinner?`<div><b>晚餐：</b>${esc(d.dinner)}</div>`:''}
      ${d.snack?`<div><b>點心：</b>${esc(d.snack)}</div>`:''}
      ${d.supplements?`<div><b>營養品：</b>${esc(d.supplements)}</div>`:''}
      ${d.exercise?`<div><b>運動：</b>${esc(d.exercise)}</div>`:''}
      ${d.sleep!=null?`<div><b>睡眠：</b>${d.sleep} hr</div>`:''}
      ${d.mood?`<div><b>心情：</b>${esc(d.mood)}</div>`:''}
      ${d.effects?`<div><b>身體感受：</b>${esc(d.effects)}</div>`:''}
      ${d.notes?`<div><b>備註：</b>${esc(d.notes)}</div>`:''}
      </div></div>`;
  }).join(''):'<div class="empty">還沒有日記，按「寫日記」開始 ♡</div>';
}
function renderWeight(){
  const c=cfg(),a=sort('w'),cur=a.at(-1)?.weight,base=c.startWeight??a[0]?.weight,goal=c.goalWeight;
  $('#weightDay').textContent=dayNo()?`第 ${dayNo()} 天`:'';
  draw('#weightChart',rangeData(a));
  const delta=(base!=null&&cur!=null)?cur-base:null;
  $('#totalDelta').textContent=delta==null?'—':`${delta>0?'+':''}${delta.toFixed(1)}kg`;
  $('#goalInside').textContent=goal!=null?`${goal}kg`:'—';$('#distanceGoal').textContent=(cur!=null&&goal!=null)?`${Math.abs(cur-goal).toFixed(1)}kg`:'—';$('#currentWeight').textContent=cur!=null?`${cur}kg`:'—';$('#initialWeight').textContent=base!=null?`${base}kg`:'—';
  $('#weightRows').innerHTML=groupRows([...a].reverse(),x=>`<div class="row"><b>${+x.date.slice(8)}日</b><b class="red">${x.weight??'—'}</b><span class="green">${x.fat??'—'}</span><span class="blue">${x.muscle??'—'}</span><span>${x.bodyFat??'—'}</span></div>`);
}
function groupRows(a,row){
  if(!a.length)return '<div class="empty">尚無紀錄</div>';let out='',last='';
  a.forEach(x=>{const ym=x.date.slice(0,7);if(ym!==last){const [y,m]=ym.split('-');out+=`<div class="month">${y}年${+m}月</div>`;last=ym}out+=row(x)});return out;
}
let cal=new Date();
$('#prevMonth').onclick=()=>{cal.setMonth(cal.getMonth()-1);renderShots()};$('#nextMonth').onclick=()=>{cal.setMonth(cal.getMonth()+1);renderShots()};
function renderShots(){
  const a=sort('s'),y=cal.getFullYear(),m=cal.getMonth();$('#shotCount').textContent=`${a.length} 次`;$('#calMonth').textContent=`${y}年${m+1}月`;
  const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();let cells='';
  for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=last;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,s=a.find(x=>x.date===ds);cells+=`<div class="day ${s?'shot':''}">${d}${s?`<small>${s.dose}mg</small>`:''}</div>`}
  $('#calGrid').innerHTML=cells;
  const recent=a.slice(-3).reverse();$('#recentShots').innerHTML=recent.length?recent.map(x=>`<div class="shotChip"><b>${x.date}・${x.dose}mg</b><br>${esc(x.site)}${x.time?`・${esc(x.time)}`:''}</div>`).join(''):'<div class="empty">尚無注射紀錄</div>';
  $('#shotRows').innerHTML=groupRows([...a].reverse(),x=>`<div class="row" style="grid-template-columns:.8fr 1.3fr .9fr"><b>${+x.date.slice(8)}日</b><span>${esc(x.site)}</span><b class="red">${x.dose}mg</b></div>`);
}
$('#doseInfo').onclick=()=>alert('這裡先作為劑量紀錄入口，不做格數換算，避免不同筆型／濃度造成誤算。');

function renderLedger(){
  const a=sort('p'),total=a.reduce((s,x)=>s+(+x.price||0),0),now=new Date(),ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`,month=a.filter(x=>x.date.startsWith(ym)).reduce((s,x)=>s+(+x.price||0),0);
  $('#totalSpend').textContent=money(total);$('#purchaseCount').textContent=a.length;$('#monthSpend').textContent=money(month);$('#avgSpend').textContent=money(a.length?total/a.length:0);
  $('#purchaseRows').innerHTML=groupRows([...a].reverse(),x=>`<div class="row" style="grid-template-columns:.7fr .8fr 1fr 1fr"><b>${+x.date.slice(8)}日</b><b class="red">${x.dose??'—'}mg</b><b>${money(x.price)}</b><span>${esc(x.place||'—')}</span></div>`);
}
function loadProfile(){
  const c=cfg();$('#startDate').value=c.startDate||'';$('#startWeight').value=c.startWeight??'';$('#goalWeight').value=c.goalWeight??'';$('#heightCm').value=c.heightCm??'';
}
$('#saveSettings').onclick=()=>{setcfg({startDate:$('#startDate').value,startWeight:num('#startWeight'),goalWeight:num('#goalWeight'),heightCm:num('#heightCm')});renderAll();toast('設定已儲存 ♡')};

$('#exportJson').onclick=()=>download(new Blob([JSON.stringify({settings:cfg(),weights:get('w'),shots:get('s'),diaries:get('d'),purchases:get('p')},null,2)],{type:'application/json'}),`diet-backup-${today()}.json`);
$('#exportCsv').onclick=()=>{
  const rows=[['type','date','v1','v2','v3']];
  get('w').forEach(x=>rows.push(['weight',x.date,x.weight,x.fat??'',x.bodyFat??'']));
  get('s').forEach(x=>rows.push(['shot',x.date,x.dose,x.site,x.time||'']));
  get('p').forEach(x=>rows.push(['purchase',x.date,x.price,x.dose??'',x.place||'']));
  const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');
  download(new Blob([csv],{type:'text/csv'}),`diet-data-${today()}.csv`);
};
$('#importJson').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(d.settings)setcfg(d.settings);if(Array.isArray(d.weights))set('w',d.weights);if(Array.isArray(d.shots))set('s',d.shots);if(Array.isArray(d.diaries))set('d',d.diaries);if(Array.isArray(d.purchases))set('p',d.purchases);renderAll();toast('備份已匯入')}catch{alert('檔案格式不正確')}
  e.target.value='';
});
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function renderAll(){renderOverview();renderWeight();renderShots();renderLedger();loadProfile()}
renderAll();
</script>
</body>
</html>
